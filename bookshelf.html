---
layout: default
title: Bookshelf
subtitle: Bookshelf
permalink: /bookshelf/
---
<!-- The shelf itself is a drop-in module, in assets/bookshelf (see its
     README); this page just hands it the books and the art -->
<link rel="stylesheet" href="{{ site.baseurl }}/assets/bookshelf/bookshelf.css?v={{ site.time | date: '%s' }}">
<section class="bookshelf" id="bookshelf"></section>
<script src="{{ site.baseurl }}/assets/bookshelf/bookshelf.js?v={{ site.time | date: '%s' }}"></script>
<script>
  Bookshelf.mount('#bookshelf', {
    books: {{ site.data.books | jsonify }},
    art: {{ site.data.art | jsonify }},
    coverBase: '{{ site.baseurl }}/images/books/',
    artBase: '{{ site.baseurl }}/images/art/',
    storageKey: 'shelf-order'
  });
</script>
