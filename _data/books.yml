# What's on the bookshelf: what I'm reading now, then what I just finished.
# Each book is drawn as a spine on the shelf (only the title is required):
#   author  shown under the title in the list
#   cover   the cover picture shown in the list, in images/books
#   color   the spine's color, as #rrggbb
#   ink     light or dark text on it (picked from the color if left out)
#   pages   how many pages it has (its thickness on the shelf follows)
#   height  how tall it stands, 90 to 180 (the shelf is 190 high)
#   current true while I'm still reading it ("currently reading" in the list)
#   note    an optional line shown under it in the list
