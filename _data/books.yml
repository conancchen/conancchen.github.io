# What's on the bookshelf: what I'm reading now, then what I just finished.
# Each book is drawn as a spine on the shelf:
#   color   the spine's color
#   ink     light or dark text on it
#   width   how thick the book is, px
#   height  how tall it stands, px (the shelf is about 200px high)
#   current true while I'm still reading it (it gets a pulsing dot)
#   note    an optional line shown under it in the list
#   cover   the cover picture shown in the list, in images/books
