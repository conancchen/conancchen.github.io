<!-- The training log. Its activities and route maps come from the strava
     repo, which syncs them from the Strava API every six hours, so nothing
     here holds a key and the page stays current without a rebuild -->
<section class="block training">
    <h2 class="block-label">Past year<span class="tr-total" id="tr-total"></span></h2>
    <div class="tr-months" id="tr-months" aria-hidden="true"></div>
    <div class="tr-grid" id="tr-grid" role="img" aria-label="A year of training, day by day"></div>
    <div class="tr-legend" aria-hidden="true">
      <span class="tr-key tr-swim">Swim</span><span class="tr-key tr-bike">Bike</span><span class="tr-key tr-run">Run</span><span class="tr-key tr-lift">Lift</span><span class="tr-key tr-race">Race</span>
    </div>
    <div class="tr-sums" id="tr-sums" hidden></div>
    <div class="tr-tip" id="tr-tip" role="tooltip"></div>
  </section>
  <script>
    // A year of training as a grid of days, a column per week from Monday
    // down: each day takes the color of the sport it spent the most time on
    // and deepens with how long it ran. Hovering a day names what was done.
    // The days come from the same synced Strava log as the Strava page.
    (function () {
      var RIDES = ['Ride', 'VirtualRide', 'EBikeRide', 'EMountainBikeRide', 'GravelRide', 'MountainBikeRide'];
      var RUNS = ['Run', 'TrailRun', 'VirtualRun', 'Treadmill'];
      fetch('https://raw.githubusercontent.com/conancchen/strava/main/activities.json', { cache: 'no-cache' })
        .then(function (r) { return r.json(); })
        .then(function (acts) {
          // A year of days ending today, each [date, swim, bike, run, lift] in minutes
          var byDay = {}, days = [], today = new Date();
          // Pool practice isn't on Strava, so in season the team's usual week
          // fills it in: the back half of last season and this one from its
          // start, minus the break over the end of the year. PRACTICE is the
          // minutes of [swim, lift] by weekday, Sunday first; a day Strava
          // already has a longer swim keeps that.
          var SEASONS = [['2025-11-01', '2026-02-02'], ['2026-09-03', '9999-12-31']];
          var BREAK = ['2025-12-22', '2025-12-31'];
          function inSeason(k) {
            if (k >= BREAK[0] && k <= BREAK[1]) return false;
            return SEASONS.some(function (s) { return k >= s[0] && k <= s[1]; });
          }
          var PRACTICE = [[0, 0], [180, 60], [120, 0], [180, 60], [120, 0], [180, 60], [120, 0]];
          // Weeks that ran differently from the usual one, as [swim, lift]
          var WEEKS = {
            '2026-10-18': [180, 60], '2026-10-19': [240, 0], '2026-10-20': [120, 0],
            '2026-10-21': [240, 0], '2026-10-22': [120, 60], '2026-10-23': [240, 0]
          };
          // Meet days count as a 4.5-hour swim instead of practice and show as races
          var MEETS = {
            '2025-11-22': 'at Cornell w/ Penn',
            '2025-12-04': 'Big Al Invitational', '2025-12-05': 'Big Al Invitational',
            '2025-12-06': 'Big Al Invitational',
            '2026-01-09': 'at Navy w/ Kenyon, Delaware', '2026-01-10': 'at Navy w/ Kenyon, Delaware',
            '2026-01-24': 'vs Penn State',
            '2026-01-30': 'at Harvard w/ Yale', '2026-01-31': 'at Harvard w/ Yale',
            '2026-10-16': 'vs Villanova',
            '2026-11-07': 'at Columbia w/ Dartmouth', '2026-11-14': 'at Penn',
            '2026-11-20': 'Big Al Invitational', '2026-11-21': 'Big Al Invitational',
            '2026-11-22': 'Big Al Invitational',
            '2027-01-08': 'vs Navy, Notre Dame, Delaware', '2027-01-09': 'vs Navy, Notre Dame, Delaware',
            '2027-01-16': 'at Brown w/ Cornell',
            '2027-01-29': 'vs Harvard & Yale', '2027-01-30': 'vs Harvard & Yale'
          };
          acts.forEach(function (a) {
            var k = a.type === 'Swim' ? 1 : RIDES.indexOf(a.type) >= 0 ? 2 : RUNS.indexOf(a.type) >= 0 ? 3 : 0;
            if (!k) return;
            var d = byDay[a.date] = byDay[a.date] || [a.date, 0, 0, 0, 0];
            d[k] += Math.round(a.moving_time_s / 60);
            // A race day keeps the race's name, less a leg's sport on the end
            // ("Ironman 70.3 bike") so a triathlon's legs read as one race
            if (a.is_race) d[5] = a.name.replace(/\s+(swim|bike|run)$/i, '');
          });
          for (var i = 364; i >= 0; i--) {
            var t = new Date(today.getFullYear(), today.getMonth(), today.getDate() - i);
            var key = t.getFullYear() + '-' + String(t.getMonth() + 1).padStart(2, '0') + '-' + String(t.getDate()).padStart(2, '0');
            var day = byDay[key] || [key, 0, 0, 0, 0];
            if (MEETS[key]) {
              day[5] = day[5] || 'Meet';
              day[6] = MEETS[key];
              day[1] = Math.max(day[1], 270);  // a meet runs about 4 to 5 hours
            } else if (inSeason(key)) {
              var plan = WEEKS[key] || PRACTICE[t.getDay()];
              day[1] = Math.max(day[1], plan[0]);
              day[4] += plan[1];
            }
            days.push(day);
          }
          draw(days);
        })
        .catch(function () { document.querySelector('.training').hidden = true; });
    })();

    function draw(DAYS) {
      var grid = document.getElementById('tr-grid');
      var months = document.getElementById('tr-months');
      var tip = document.getElementById('tr-tip');
      var SPORTS = ['swim', 'bike', 'run', 'lift'];
      var MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
      var WEEKDAYS = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];

      function parse(s) {
        var p = s.split('-');
        return new Date(+p[0], +p[1] - 1, +p[2]);
      }
      function hm(min) {
        var h = Math.floor(min / 60), m = min % 60;
        return h ? h + 'h' + (m ? ' ' + m + 'm' : '') : m + 'm';
      }

      // Pad the first week so every column starts on a Monday
      var lead = (parse(DAYS[0][0]).getDay() + 6) % 7;
      for (var i = 0; i < lead; i++) {
        var pad = document.createElement('span');
        pad.className = 'tr-day tr-pad';
        grid.appendChild(pad);
      }

      var total = 0, lastMonth = -1;
      DAYS.forEach(function (d, n) {
        var mins = d.slice(1, 5), sum = mins[0] + mins[1] + mins[2] + mins[3];
        var top = mins.indexOf(Math.max.apply(null, mins));
        var level = sum === 0 ? 0 : sum < 60 ? 1 : sum < 105 ? 2 : sum < 165 ? 3 : 4;
        var cell = document.createElement('span');
        cell.className = 'tr-day' + (d[5] ? ' tr-race' : level ? ' tr-' + SPORTS[top] + ' tr-l' + level : '');
        var date = parse(d[0]);
        var parts = [];
        SPORTS.forEach(function (s, k) { if (mins[k]) parts.push(hm(mins[k]) + ' ' + s); });
        cell.dataset.tip = WEEKDAYS[date.getDay()] + ', ' + MONTHS[date.getMonth()] + ' ' + date.getDate() +
          ' · ' + (d[6] ? d[6] + (parts.length ? ', ' : '') : '') +
          (parts.length ? parts.join(', ') : d[6] ? '' : 'rest');
        grid.appendChild(cell);
        total += sum;

        // Label a month over the first full week that starts in it
        var col = Math.floor((n + lead) / 7);
        if (date.getDay() === 1 && date.getMonth() !== lastMonth && date.getDate() <= 7) {
          lastMonth = date.getMonth();
          var label = document.createElement('span');
          label.textContent = MONTHS[lastMonth];
          label.style.gridColumn = col + 1;
          months.appendChild(label);
        }
      });

      var cols = Math.ceil((DAYS.length + lead) / 7);
      grid.style.setProperty('--cols', cols);
      months.style.setProperty('--cols', cols);
      document.getElementById('tr-total').textContent = Math.round(total / 60) + ' hours';

      // Hours by sport, this calendar month and the whole year
      var thisMonth = DAYS[DAYS.length - 1][0].slice(0, 7);
      var month = [0, 0, 0, 0], year = [0, 0, 0, 0];
      DAYS.forEach(function (d) {
        for (var k = 0; k < 4; k++) {
          year[k] += d[k + 1];
          if (d[0].slice(0, 7) === thisMonth) month[k] += d[k + 1];
        }
      });
      function hrs(min) { return Math.round(min / 60).toLocaleString(); }
      function card(title, mins) {
        var all = mins[0] + mins[1] + mins[2] + mins[3];
        var bar = SPORTS.map(function (s, k) {
          return mins[k] ? '<span class="tr-' + s + '" style="flex:' + mins[k] + '"></span>' : '';
        }).join('');
        var rows = SPORTS.map(function (s, k) {
          return '<li class="tr-key tr-' + s + '"><span>' + s.charAt(0).toUpperCase() + s.slice(1) +
            '</span><span>' + hrs(mins[k]) + ' h</span></li>';
        }).join('');
        return '<div class="tr-card"><span class="tr-card-title">' + title + '</span>' +
          '<span class="tr-card-total">' + hrs(all) + '<small> hours</small></span>' +
          '<div class="tr-bar">' + bar + '</div><ul>' + rows + '</ul></div>';
      }
      var sums = document.getElementById('tr-sums');
      sums.innerHTML = card(['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'][+thisMonth.slice(5) - 1], month) + card('Past year', year);
      sums.hidden = false;

      function show(cell) {
        tip.textContent = cell.dataset.tip;
        tip.classList.add('is-on');
        var box = grid.parentNode.getBoundingClientRect(), c = cell.getBoundingClientRect();
        var x = c.left + c.width / 2 - box.left;
        var half = tip.offsetWidth / 2;
        tip.style.left = Math.max(half, Math.min(box.width - half, x)) + 'px';
        tip.style.top = (c.top - box.top - 6) + 'px';
      }
      grid.addEventListener('mouseover', function (e) {
        if (e.target.dataset && e.target.dataset.tip) show(e.target);
      });
      grid.addEventListener('mouseleave', function () { tip.classList.remove('is-on'); });
    }
  </script>

<section class="block sv-section is-closed" id="sv-section">
<div class="sv-head">
  <h2 class="block-label"><button type="button" class="sv-toggle" id="sv-toggle" aria-expanded="false" aria-controls="sv-body">Activities from Strava</button></h2>
  <p class="sort-line sv-filters" id="sv-filters">
    <button type="button" class="is-on" data-scope="all">all</button>
    <button type="button" data-scope="races">races</button>
  </p>
</div>

<div class="sv-body" id="sv-body">
<div class="sv-log" id="sv-log" aria-live="polite"></div>

<p class="sv-foot" id="sv-foot"></p>
</div>
</section>

<script src="{{ site.baseurl }}/assets/strava/strava.js?v={{ site.time | date: '%s' }}"></script>
