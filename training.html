<!-- The training log. Its activities and route maps come from the strava
     repo, which syncs them from the Strava API every six hours, so nothing
     here holds a key and the page stays current without a rebuild -->
<section class="block training">
    <h2 class="tr-title" id="tr-title">Training in the last year</h2>
    <div class="tr-box">
      <div class="tr-cal">
        <div class="tr-months" id="tr-months" aria-hidden="true"></div>
        <div class="tr-body">
          <div class="tr-wdays" aria-hidden="true"><span>Mon</span><span></span><span>Wed</span><span></span><span>Fri</span><span></span><span></span></div>
          <div class="tr-grid" id="tr-grid" role="img" aria-label="A year of training, day by day"></div>
        </div>
        <div class="tr-foot" aria-hidden="true">
          <div class="tr-legend">
            <span class="tr-key tr-swim">Swim</span><span class="tr-key tr-bike">Bike</span><span class="tr-key tr-run">Run</span><span class="tr-key tr-race">Race</span>
          </div>
          <div class="tr-scale">Less<span class="tr-day"></span><span class="tr-day tr-swim tr-l1"></span><span class="tr-day tr-swim tr-l2"></span><span class="tr-day tr-swim tr-l3"></span><span class="tr-day tr-swim tr-l4"></span>More</div>
        </div>
      </div>
      <div class="tr-sums" id="tr-sums" hidden></div>
    </div>
    <div class="tr-tip" id="tr-tip" role="tooltip"></div>
  </section>
  <script src="{{ site.baseurl }}/assets/strava/schedule.js?v={{ site.time | date: '%s' }}"></script>
  <script>
    // A year of training as a grid of days, a column per week from Monday
    // down: each day takes the color of the sport it spent the most time on
    // and deepens with how long it ran. Hovering a day names what was done.
    // The days come from the same synced Strava log as the Strava page.
    (function () {
      var RIDES = ['Ride', 'VirtualRide', 'EBikeRide', 'EMountainBikeRide', 'GravelRide', 'MountainBikeRide'];
      var RUNS = ['Run', 'TrailRun', 'VirtualRun', 'Treadmill'];
      fetch('https://raw.githubusercontent.com/conancchen/strava/main/activities.json', { cache: 'no-cache' })
        .then(function (r) { return r.json(); })
        .then(function (acts) {
          // A year of days ending today, each [date, swim, bike, run, lift] in minutes
          var byDay = {}, days = [], today = new Date();
          // Pool practice and meets aren't on Strava, so they come from the
          // team's schedule; a day Strava already has a longer swim keeps that
          acts.forEach(function (a) {
            var k = a.type === 'Swim' ? 1 : RIDES.indexOf(a.type) >= 0 ? 2 : RUNS.indexOf(a.type) >= 0 ? 3 : 0;
            if (!k) return;
            var d = byDay[a.date] = byDay[a.date] || [a.date, 0, 0, 0, 0];
            d[k] += Math.round(a.moving_time_s / 60);
            // A race day keeps the race's name, less a leg's sport on the end
            // ("Ironman 70.3 bike") so a triathlon's legs read as one race
            if (a.is_race) d[5] = a.name.replace(/\s+(swim|bike|run)$/i, '')
              .replace(/(^|[\s(-])([a-z])([a-z']*)/g, function (m, pre, c, rest) {
                // In title case, as Strava has some names all in lowercase
                return pre && /^(a|an|and|at|by|for|in|of|on|the|to|vs|w)$/.test(c + rest) ? m : pre + c.toUpperCase() + rest;
              });
          });
          for (var i = 364; i >= 0; i--) {
            var t = new Date(today.getFullYear(), today.getMonth(), today.getDate() - i);
            var key = SCHEDULE.keyOf(t);
            var day = byDay[key] || [key, 0, 0, 0, 0];
            var plan = SCHEDULE.day(t);
            if (plan) {
              day[1] = Math.max(day[1], plan.swim);
              day[4] += plan.lift;
              if (plan.meet) {
                day[5] = day[5] || 'Meet';
                day[6] = plan.meet;
              }
            }
            days.push(day);
          }
          draw(days);
        })
        .catch(function () { document.querySelector('.training').hidden = true; });
    })();

    function draw(DAYS) {
      var grid = document.getElementById('tr-grid');
      var months = document.getElementById('tr-months');
      var tip = document.getElementById('tr-tip');
      var SPORTS = ['swim', 'bike', 'run', 'lift'];
      var MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
      var WEEKDAYS = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];

      function parse(s) {
        var p = s.split('-');
        return new Date(+p[0], +p[1] - 1, +p[2]);
      }
      function hm(min) {
        var h = Math.floor(min / 60), m = min % 60;
        return h ? h + 'h' + (m ? ' ' + m + 'm' : '') : m + 'm';
      }

      // Pad the first week so every column starts on a Monday
      var lead = (parse(DAYS[0][0]).getDay() + 6) % 7;
      for (var i = 0; i < lead; i++) {
        var pad = document.createElement('span');
        pad.className = 'tr-day tr-pad';
        grid.appendChild(pad);
      }

      var total = 0, lastMonth = -1;
      DAYS.forEach(function (d, n) {
        var mins = d.slice(1, 5), sum = mins[0] + mins[1] + mins[2] + mins[3];
        var top = mins.indexOf(Math.max.apply(null, mins));
        var level = sum === 0 ? 0 : sum < 60 ? 1 : sum < 105 ? 2 : sum < 165 ? 3 : 4;
        var cell = document.createElement('span');
        cell.className = 'tr-day' + (d[5] ? ' tr-race' : level ? ' tr-' + SPORTS[top] + ' tr-l' + level : '');
        var date = parse(d[0]);
        var parts = [];
        SPORTS.forEach(function (s, k) { if (mins[k]) parts.push(hm(mins[k]) + ' ' + s); });
        // A race or meet day says only which one it was, not how long it ran
        cell.dataset.tip = WEEKDAYS[date.getDay()] + ', ' + MONTHS[date.getMonth()] + ' ' + date.getDate() +
          ' · ' + (d[5] ? d[6] || d[5] : parts.length ? parts.join(', ') : 'rest');
        grid.appendChild(cell);
        total += sum;

        // Label a month over the first full week that starts in it
        var col = Math.floor((n + lead) / 7);
        if (date.getDay() === 1 && date.getMonth() !== lastMonth && date.getDate() <= 7) {
          lastMonth = date.getMonth();
          var label = document.createElement('span');
          label.textContent = MONTHS[lastMonth];
          label.style.gridColumn = col + 1;
          months.appendChild(label);
        }
      });

      var cols = Math.ceil((DAYS.length + lead) / 7);
      // A month that starts in the last few weeks has no room to its right
      // for its name, so the name ends at the grid's edge instead
      var lastLabel = months.lastElementChild;
      if (lastLabel && +lastLabel.style.gridColumnStart > cols - 4) {
        lastLabel.style.gridColumn = (cols - 4) + ' / ' + (cols + 1);
        lastLabel.style.textAlign = 'right';
      }
      grid.style.setProperty('--cols', cols);
      months.style.setProperty('--cols', cols);
      // On a narrow screen even that can run into the month before it, and
      // then the name is left out
      var before = lastLabel && lastLabel.previousElementSibling;
      if (before) {
        var range = document.createRange();
        range.selectNodeContents(lastLabel);
        if (range.getBoundingClientRect().left < before.getBoundingClientRect().left + before.scrollWidth + 4) lastLabel.hidden = true;
      }
      document.getElementById('tr-title').textContent =
        Math.round(total / 60).toLocaleString() + ' hours of training in the last year';

      // The activity overview, as on a GitHub profile: a few lines on the
      // left, and on the right a cross with an arm per sport, its point out
      // along the arm by its share of the year's hours, the busiest sport's
      // reaching the end. The points go out by the square root of the share,
      // so the smaller sports keep clear of the middle and of each other
      // when one sport takes most of the year
      var thisMonth = DAYS[DAYS.length - 1][0].slice(0, 7);
      var monthMins = 0, weekMins = 0, year = [0, 0, 0, 0], races = 0;
      // The week starts on Monday, as the grid's columns do
      var weekDays = (parse(DAYS[DAYS.length - 1][0]).getDay() + 6) % 7 + 1;
      DAYS.forEach(function (d, n) {
        if (n >= DAYS.length - weekDays) weekMins += d[1] + d[2] + d[3] + d[4];
        for (var k = 0; k < 4; k++) year[k] += d[k + 1];
        if (d[0].slice(0, 7) === thisMonth) monthMins += d[1] + d[2] + d[3] + d[4];
        // A meet over several days in a row is one race
        var prev = DAYS[n - 1];
        if (d[5] && !(prev && prev[5] === d[5] && prev[6] === d[6])) races++;
      });
      var yearMins = year[0] + year[1] + year[2] + year[3];
      var monthName = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'][+thisMonth.slice(5) - 1];
      function hrs(min) { return Math.round(min / 60).toLocaleString(); }

      // Swim to the left, bike up, run to the right, lift down. The cross
      // is a little wider than it is tall, to sit beside the few lines on
      // its left
      var CX = 120, CY = 64, ARMS = [52, 48, 52, 48];
      var DIRS = [[-1, 0], [0, -1], [1, 0], [0, 1]];
      var most = Math.max.apply(null, year) || 1;
      var pts = year.map(function (m, k) {
        var r = Math.sqrt(m / most) * ARMS[k];
        return [CX + DIRS[k][0] * r, CY + DIRS[k][1] * r];
      });
      var svg = '<svg class="tr-cross" viewBox="0 0 240 128" role="img" aria-label="Share of the year\'s hours by sport">';
      SPORTS.forEach(function (s, k) {
        svg += '<line class="tr-' + s + '" x1="' + CX + '" y1="' + CY + '" x2="' + (CX + DIRS[k][0] * ARMS[k]) + '" y2="' + (CY + DIRS[k][1] * ARMS[k]) + '"/>';
      });
      // The shape between the four points, each side bowing in toward the
      // middle: a curve whose handle sits partway from the side's midpoint
      // to the center
      var d = 'M' + pts[0][0].toFixed(1) + ',' + pts[0][1].toFixed(1);
      for (var j = 0; j < 4; j++) {
        var p1 = pts[j], p2 = pts[(j + 1) % 4];
        var qx = (p1[0] + p2[0]) / 2, qy = (p1[1] + p2[1]) / 2;
        qx += (CX - qx) * 0.7;
        qy += (CY - qy) * 0.7;
        d += ' Q' + qx.toFixed(1) + ',' + qy.toFixed(1) + ' ' + p2[0].toFixed(1) + ',' + p2[1].toFixed(1);
      }
      svg += '<path class="tr-shape" d="' + d + ' Z"/>';
      pts.forEach(function (p, k) {
        if (year[k]) svg += '<circle class="tr-' + SPORTS[k] + '" cx="' + p[0] + '" cy="' + p[1] + '" r="3"/>';
      });
      // Whole percents that add to 100: each share rounded down, then the
      // points left over handed to the largest remainders
      var pcts = year.map(function (m) { return Math.floor(m / (yearMins || 1) * 100); });
      var left = yearMins ? 100 - pcts[0] - pcts[1] - pcts[2] - pcts[3] : 0;
      year.map(function (m, k) { return [m / yearMins * 100 - pcts[k], k]; })
        .sort(function (a, b) { return b[0] - a[0]; })
        .slice(0, left)
        .forEach(function (r) { pcts[r[1]]++; });
      // Each arm's label, the share then the sport's name on one line: past
      // the ends of the arms across, and beside the ends of the arms up and
      // down, so the chart stays short
      var LABELS = [[CX - ARMS[0] - 8, CY + 4, 'end'], [CX + 9, CY - ARMS[1] + 8, 'start'], [CX + ARMS[2] + 8, CY + 4, 'start'], [CX + 9, CY + ARMS[3], 'start']];
      SPORTS.forEach(function (s, k) {
        var L = LABELS[k], pct = pcts[k], name = s.charAt(0).toUpperCase() + s.slice(1);
        svg += '<text x="' + L[0] + '" y="' + L[1] + '" text-anchor="' + L[2] + '">' +
          '<tspan class="tr-pct" x="' + L[0] + '">' + pct + '%</tspan>' +
          '<tspan dx="4">' + name + '</tspan></text>';
      });
      svg += '</svg>';

      var sums = document.getElementById('tr-sums');
      sums.innerHTML = '<div class="tr-overview"><h3>Activity overview</h3><ul>' +
        '<li><b>' + hrs(weekMins) + ' hours</b> so far this week</li>' +
        '<li><b>' + hrs(monthMins) + ' hours</b> so far in ' + monthName + '</li>' +
        '<li><b>' + races + (races === 1 ? ' race or meet' : ' races and meets') + '</b> this year</li>' +
        '</ul></div><div class="tr-radar">' + svg + '</div>';
      sums.hidden = false;

      function show(cell) {
        tip.textContent = cell.dataset.tip;
        tip.classList.add('is-on');
        var box = tip.offsetParent.getBoundingClientRect(), c = cell.getBoundingClientRect();
        var x = c.left + c.width / 2 - box.left;
        var half = tip.offsetWidth / 2;
        tip.style.left = Math.max(half, Math.min(box.width - half, x)) + 'px';
        tip.style.top = (c.top - box.top - 6) + 'px';
      }
      grid.addEventListener('mouseover', function (e) {
        if (e.target.dataset && e.target.dataset.tip) show(e.target);
      });
      grid.addEventListener('mouseleave', function () { tip.classList.remove('is-on'); });
    }
  </script>

<section class="block sv-section" id="sv-section">
<div class="sv-head">
  <h2 class="block-label">Recent activities</h2>
</div>

<div class="sv-body" id="sv-body">
<div class="sv-log" id="sv-log" aria-live="polite"></div>

<div class="sv-end">
  <button type="button" class="sv-more" id="sv-more" hidden>Show more activity</button>
  <p class="sv-foot" id="sv-foot"></p>
</div>
</div>
</section>

<script src="{{ site.baseurl }}/assets/strava/strava.js?v={{ site.time | date: '%s' }}"></script>
