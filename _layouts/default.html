<!DOCTYPE HTML>
<html lang="en">

<head>
  <title>{{ page.title | default: 'conan' }}</title>

  <!-- Runs before paint so the saved theme applies without a flash -->
  <script>
    (function () {
      document.documentElement.setAttribute('data-theme', localStorage.getItem('theme') || 'dark');

      // Hides the page's fade-in content before first paint, so it never
      // flashes fully rendered first. Skipped entirely under reduced motion,
      // so that path never hides anything.
      var reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      if (!reduceMotion) {
        document.documentElement.classList.add('anim-hide-intro', 'anim-hide-fade');
      }
    })();
  </script>

  <meta content="text/html; charset=utf-8" http-equiv="Content-Type">
  <meta name="google" content="notranslate">

  <meta name="author" content="{{ site.name }}" />
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap">

  <!-- Build timestamp busts the browser cache whenever the site is rebuilt -->
  <link rel="stylesheet" type="text/css" href="{{ site.baseurl }}/style.css?v={{ site.time | date: '%s' }}" />
  <link rel="canonical" href="{{ page.url | replace:'index.html','' | prepend: site.baseurl | prepend: site.url }}">

  <link rel="icon" type="image/x-icon" href="{{ site.baseurl }}/favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="{{ site.baseurl }}/images/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="{{ site.baseurl }}/images/favicon-16.png">
  <link rel="icon" type="image/png" sizes="192x192" href="{{ site.baseurl }}/images/favicon-192.png">
  <link rel="apple-touch-icon" href="{{ site.baseurl }}/images/apple-touch-icon.png">
</head>

<body>
  <div class="page">
    <header class="header">
      <div class="header-row">
        <h1 translate="no"><button type="button" class="home-link" onclick="playTitleScramble()" title="Replay the animation">{{ page.heading | default: site.name }}</button></h1>
        <div class="header-actions">
        {% unless page.home %}<a class="icon-button" href="{{ site.baseurl }}/" aria-label="Back to the home page" title="Back">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="7 3 3 7 7 11"></polyline>
            <path d="M3 7h11a6 6 0 0 1 0 12H6"></path>
          </svg>
        </a>{% endunless %}
        <button class="icon-button" id="theme-toggle" onclick="toggleTheme()" aria-label="Switch to light mode" title="Switch to light mode">
          <svg class="icon-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="4"></circle>
            <line x1="12" y1="2" x2="12" y2="4"></line>
            <line x1="12" y1="20" x2="12" y2="22"></line>
            <line x1="4.93" y1="4.93" x2="6.34" y2="6.34"></line>
            <line x1="17.66" y1="17.66" x2="19.07" y2="19.07"></line>
            <line x1="2" y1="12" x2="4" y2="12"></line>
            <line x1="20" y1="12" x2="22" y2="12"></line>
            <line x1="4.93" y1="19.07" x2="6.34" y2="17.66"></line>
            <line x1="17.66" y1="6.34" x2="19.07" y2="4.93"></line>
          </svg>
          <svg class="icon-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
          </svg>
        </button>
        </div>
      </div>
      {% if page.subtitle %}<p class="subtitle" translate="no">{{ page.subtitle }}</p>
      {% elsif page.show_updated %}<p class="subtitle" translate="no">Updated {{ site.time | date: "%b %-d, %Y" }}</p>{% endif %}
    </header>

    <!-- Runs as soon as the title is parsed, so the first paint is already scrambled -->
    <script>
      // Cycles the name and the "Updated" line through random, randomly colored
      // glyphs, locking each one in (in the normal text color) from left to
      // right until it spells the real text, all finishing at TOTAL_MS
      window.playTitleScramble = function () {};
      window.scrambleSwap = function (el, text) { el.textContent = text; };

      (function () {
        var link = document.querySelector('.home-link');
        var reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        if (!link || reduceMotion) return;

        // Scramble glyphs are simple (few-stroke) Chinese characters. They are
        // why the page opts out of browser translation in the head — otherwise
        // Chrome offers to translate the site while the title is scrambling.
        var GLYPHS = '一乙二十丁七人入八九几儿了力乃刀又三干于亏士工土才下寸大丈与万上小口山巾千川个夕久么及广亡门义之尸弓己已子女飞刃习叉马乡王天夫元无云专不五支厅太犬区历友尤匹车巨牙屯戈比互切瓦止少日中贝内水见午牛手气毛长仁什片化币仍仅斤爪反介父从今凶分乏公仓月氏勿欠风丹匀乌凤勾文六方火为斗忆订计户认心打巧正扑扒功扔去甘世古节本术可丙左厉右石布龙平灭东卡北占业旧帅归且旦目叶甲申叮电号田由只史央兄叫另叹四生失禾丘付仗代';

        function randomGlyph() {
          return GLYPHS.charAt(Math.floor(Math.random() * GLYPHS.length));
        }

        var TICK = 40;          // ms between scramble frames
        var TOTAL_MS = 2200;    // when the last letter locks in
        var TOTAL_TICKS = TOTAL_MS / TICK;
        var LOCK_START = TOTAL_TICKS * 0.25;  // ticks of pure scramble before the first letter locks
        var LAST_LOCK = TOTAL_TICKS - 1;      // tick on which the last letter locks
        // Any hue is fair game, but saturation and lightness are fixed so the
        // colors read as one family (tweak these to change the feel)
        var SATURATION = 75;       // %
        var LIGHTNESS_DARK = 70;   // % on the dark theme
        var LIGHTNESS_LIGHT = 45;  // % on the light theme
        var targets = [];
        var tick = 0;
        var timer = null;

        // Wraps every character of every text node under el in its own span,
        // remembering the original text nodes so they can be put back when the
        // animation ends
        function makeTarget(el, box) {
          var t = { el: el, box: box || el, chars: [], nodes: [] };

          // Fallback fonts for exotic glyphs can have different line metrics and
          // widths; pin the height and keep the text on one line so the page
          // below never jumps while it scrambles
          t.box.style.height = t.box.offsetHeight + 'px';
          el.style.whiteSpace = 'nowrap';

          var walker = document.createTreeWalker(el, NodeFilter.SHOW_TEXT);
          var texts = [];
          while (walker.nextNode()) texts.push(walker.currentNode);

          texts.forEach(function (node) {
            var frag = document.createDocumentFragment();
            var spans = node.nodeValue.split('').map(function (ch) {
              var span = document.createElement('span');
              frag.appendChild(span);
              t.chars.push({ span: span, ch: ch });
              return span;
            });
            if (!spans.length) return;
            node.parentNode.replaceChild(frag, node);
            t.nodes.push({ orig: node, spans: spans });
          });

          // Letters lock left to right, the last one on LAST_LOCK
          t.step = t.chars.length > 1 ? (LAST_LOCK - LOCK_START) / (t.chars.length - 1) : 0;
          targets.push(t);
        }

        function restore(t) {
          t.box.style.height = '';
          t.el.style.whiteSpace = '';
          t.nodes.forEach(function (n) {
            n.spans[0].parentNode.insertBefore(n.orig, n.spans[0]);
            n.spans.forEach(function (span) { span.parentNode.removeChild(span); });
          });
        }

        // The page's fade-in is timed to finish right as the last letter locks.
        // Locks only happen on whole ticks, so round up to the tick it lands on.
        window.titleAnimationMs = Math.ceil(LAST_LOCK) * TICK;

        // Screen readers should hear the name, not the gibberish
        link.setAttribute('aria-label', link.textContent);


        function randomColor() {
          var dark = document.documentElement.getAttribute('data-theme') === 'dark';
          var hue = Math.floor(Math.random() * 360);
          return 'hsl(' + hue + ', ' + SATURATION + '%, ' + (dark ? LIGHTNESS_DARK : LIGHTNESS_LIGHT) + '%)';
        }

        function render() {
          targets.forEach(function (t) {
            t.chars.forEach(function (c, i) {
              if (tick >= LOCK_START + i * t.step || /\s/.test(c.ch)) {
                c.span.textContent = c.ch;
                c.span.style.color = '';
              } else {
                c.span.textContent = randomGlyph();
                c.span.style.color = randomColor();
              }
            });
          });
        }

        function play() {
          if (timer) return;  // a replay while one is running would fight it
          targets = [];
          tick = 0;
          makeTarget(link, link.parentNode);
          var subtitle = document.querySelector('.subtitle');
          if (subtitle) makeTarget(subtitle);
          render();
          timer = setInterval(function () {
            tick++;
            render();
            if (tick >= TOTAL_TICKS) {
              clearInterval(timer);
              timer = null;
              targets.forEach(restore);
            }
          }, TICK);
        }

        // Scrambles an element's text into a new string, for anything else on
        // the page that wants the same effect (the clock's location does). It
        // churns through letters rather than the title's Chinese, since it is
        // landing on a Latin word.
        var LETTERS = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz';

        function randomLetter() {
          return LETTERS.charAt(Math.floor(Math.random() * LETTERS.length));
        }

        window.scrambleSwap = function (el, text, ms) {
          var ticks = Math.max(2, Math.round(ms / TICK));
          var lockStart = ticks * 0.25;
          var step = text.length > 1 ? (ticks - 1 - lockStart) / (text.length - 1) : 0;
          var n = 0;
          var id = setInterval(function () {
            var out = '';
            for (var i = 0; i < text.length; i++) {
              out += (n >= lockStart + i * step || /\s/.test(text.charAt(i)))
                ? text.charAt(i) : randomLetter();
            }
            el.textContent = out;
            if (++n > ticks) {
              clearInterval(id);
              el.textContent = text;
            }
          }, TICK);
        };

        window.playTitleScramble = play;
        play();
      })();
    </script>

    {{ content }}
  </div>

  <div id="copy-toast">Copied to clipboard</div>

  <script>
    function applyTheme(theme) {
      document.documentElement.setAttribute('data-theme', theme);
      var label = theme === 'dark' ? 'Switch to light mode' : 'Switch to dark mode';
      var toggle = document.getElementById('theme-toggle');
      toggle.setAttribute('aria-label', label);
      toggle.setAttribute('title', label);
    }

    function toggleTheme() {
      var next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
      localStorage.setItem('theme', next);
      applyTheme(next);
    }

    applyTheme(document.documentElement.getAttribute('data-theme'));

    function copyText(text) {
      if (navigator.clipboard && window.isSecureContext) {
        return navigator.clipboard.writeText(text);
      }
      var field = document.createElement('textarea');
      field.value = text;
      field.style.position = 'fixed';
      field.style.opacity = '0';
      document.body.appendChild(field);
      field.select();
      document.execCommand('copy');
      document.body.removeChild(field);
      return Promise.resolve();
    }

    var emailResetTimer;
    var toastTimer;

    function copyEmail(event) {
      event.preventDefault();
      var address = 'conanc@princeton.edu';
      var link = document.getElementById('email-link');
      link.textContent = 'at ' + address;

      // Rapid clicks restart the countdown instead of stacking timers
      clearTimeout(emailResetTimer);
      emailResetTimer = setTimeout(function () {
        link.textContent = 'by email';
      }, 3000);

      var toast = document.getElementById('copy-toast');
      function notify() {
        toast.style.opacity = '1';
        clearTimeout(toastTimer);
        toastTimer = setTimeout(function () { toast.style.opacity = '0'; }, 2000);
      }
      copyText(address).then(notify, notify);
    }

    // Fades in each child of the page's ".fade-intro" one after another (or
    // all together, with data-fade-together), spread so the last one finishes
    // exactly when the title's glyph animation does, and then reveals
    // ".fade-target" (if present).
    (function () {
      var ITEM_FADE_MS = 500;   // how long each item takes to fade in
      var FALLBACK_TOTAL_MS = 2000;  // used if the title animation isn't running
      var root = document.documentElement;
      var intro = document.querySelector('.fade-intro');

      var items = intro ? Array.prototype.slice.call(intro.children) : [];
      var totalMs = window.titleAnimationMs || FALLBACK_TOTAL_MS;
      // Items start evenly spaced so the last one ends at totalMs — unless
      // there is only one, or the container asked for them all at once, in
      // which case they fade together over the whole span
      var stagger = items.length > 1 && !intro.hasAttribute('data-fade-together');
      var fadeMs = stagger ? Math.min(ITEM_FADE_MS, totalMs) : totalMs;
      var stepMs = stagger ? (totalMs - fadeMs) / (items.length - 1) : 0;
      items.forEach(function (item, i) {
        item.style.transition = 'opacity ' + fadeMs + 'ms ease ' + Math.round(i * stepMs) + 'ms';
      });

      // Flush styles first so the hidden state is applied before the class
      // comes off; otherwise the browser would skip the transition
      if (intro) void intro.offsetWidth;
      root.classList.remove('anim-hide-intro');

      var introMs = items.length ? totalMs : 0;
      setTimeout(function () {
        root.classList.remove('anim-hide-fade');
      }, introMs);
    })();
  </script>
</body>

</html>
