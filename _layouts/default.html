<!DOCTYPE HTML>
<html lang="en">

<head>
  <title>{{ page.title | default: 'conan' }}</title>

  <!-- Runs before paint so the saved theme applies without a flash -->
  <script>
    (function () {
      document.documentElement.setAttribute('data-theme', localStorage.getItem('theme') || 'dark');

      // Hides the page before first paint, so it never
      // flashes fully rendered first. Skipped entirely under reduced motion,
      // so that path never hides anything.
      var reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      if (!reduceMotion) {
        document.documentElement.classList.add('anim-hide');
      }
    })();
  </script>

  <meta content="text/html; charset=utf-8" http-equiv="Content-Type">
  <meta name="google" content="notranslate">

  <meta name="author" content="{{ site.name }}" />
  <!-- Keeps search engines from listing the site; it is only for people who have the link -->
  <meta name="robots" content="noindex, nofollow">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap">

  <!-- Build timestamp busts the browser cache whenever the site is rebuilt -->
  <link rel="stylesheet" type="text/css" href="{{ site.baseurl }}/style.css?v={{ site.time | date: '%s' }}" />
  <link rel="canonical" href="{{ page.url | replace:'index.html','' | prepend: site.baseurl | prepend: site.url }}">

  <link rel="icon" type="image/x-icon" href="{{ site.baseurl }}/favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="{{ site.baseurl }}/images/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="{{ site.baseurl }}/images/favicon-16.png">
  <link rel="icon" type="image/png" sizes="192x192" href="{{ site.baseurl }}/images/favicon-192.png">
  <link rel="apple-touch-icon" href="{{ site.baseurl }}/images/apple-touch-icon.png">
</head>

<body>
  <div class="page">
    <header class="header">
      <div class="header-row">
        <h1 translate="no">{{ page.heading | default: site.name }}</h1>
        <div class="header-actions">
        {% unless page.home %}<a class="icon-button" href="{{ site.baseurl }}/" aria-label="Back to the home page" title="Back">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="7 3 3 7 7 11"></polyline>
            <path d="M3 7h11a6 6 0 0 1 0 12H6"></path>
          </svg>
        </a>{% endunless %}
        <button class="icon-button" id="theme-toggle" onclick="toggleTheme()" aria-label="Switch to dark mode" title="Switch to dark mode">
          <svg class="icon-yinyang" width="18" height="18" viewBox="0 0 24 24" fill="currentColor" fill-rule="evenodd">
            <path class="yin" d="M12 1.75 A10.25 10.25 0 0 0 12 22.25 A5.125 5.125 0 0 0 12 12 A5.125 5.125 0 0 1 12 1.75 Z M13.6 17.125 A1.6 1.6 0 1 0 10.4 17.125 A1.6 1.6 0 1 0 13.6 17.125 Z M13.6 6.875 A1.6 1.6 0 1 0 10.4 6.875 A1.6 1.6 0 1 0 13.6 6.875 Z"></path>
            <path class="yang" d="M12 1.75 A10.25 10.25 0 0 1 12 22.25 A5.125 5.125 0 0 0 12 12 A5.125 5.125 0 0 1 12 1.75 Z M13.6 6.875 A1.6 1.6 0 1 0 10.4 6.875 A1.6 1.6 0 1 0 13.6 6.875 Z M13.6 17.125 A1.6 1.6 0 1 0 10.4 17.125 A1.6 1.6 0 1 0 13.6 17.125 Z"></path>
          </svg>
        </button>
        </div>
      </div>
      {% if page.subtitle %}<p class="subtitle" translate="no">{{ page.subtitle }}</p>{% endif %}
    </header>

    <script>
      // Scrambles text into new text, churning through random characters that
      // lock in left to right. It takes a list of [element, text] parts and
      // treats them as one line, so a sentence split across several elements
      // scrambles as a whole. A part's text can be a function, read afresh every
      // frame, for text that keeps changing underneath (like a ticking clock).
      // Digits churn through digits and everything else through letters;
      // spaces stay put. Calls done() once every part has settled.
      window.scrambleSwap = function (parts, ms, done) {
        var TICK = 40;  // ms between scramble frames
        var LETTERS = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz';
        var DIGITS = '0123456789';
        var reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        function read(part) {
          return typeof part[1] === 'function' ? part[1]() : part[1];
        }
        function settle() {
          parts.forEach(function (part) { part[0].textContent = read(part); });
          if (done) done();
        }
        if (reduceMotion) { settle(); return; }

        var length = parts.reduce(function (sum, part) { return sum + read(part).length; }, 0);
        var ticks = Math.max(2, Math.round(ms / TICK));
        var lockStart = ticks * 0.25;
        var step = length > 1 ? (ticks - 1 - lockStart) / (length - 1) : 0;
        var n = 0;
        var id = setInterval(function () {
          var at = 0;  // position along the whole line
          parts.forEach(function (part) {
            var text = read(part);
            var out = '';
            for (var i = 0; i < text.length; i++, at++) {
              var c = text.charAt(i);
              var pool = /\d/.test(c) ? DIGITS : LETTERS;
              out += (n >= lockStart + at * step || /\s/.test(c))
                ? c : pool.charAt(Math.floor(Math.random() * pool.length));
            }
            part[0].textContent = out;
          });
          if (++n > ticks) {
            clearInterval(id);
            settle();
          }
        }, TICK);
      };
    </script>

    {{ content }}
  </div>

  <div id="copy-toast">Copied to clipboard</div>

  <script>
    function applyTheme(theme) {
      document.documentElement.setAttribute('data-theme', theme);
      var label = theme === 'dark' ? 'Switch to light mode' : 'Switch to dark mode';
      var toggle = document.getElementById('theme-toggle');
      toggle.setAttribute('aria-label', label);
      toggle.setAttribute('title', label);
    }

    // Each switch spins the yin-yang one full turn: clockwise into dark,
    // counterclockwise into light
    var yinyangAngle = 0;

    function switchTheme(next) {
      localStorage.setItem('theme', next);
      applyTheme(next);
      yinyangAngle += next === 'dark' ? 360 : -360;
      var icon = document.querySelector('#theme-toggle .icon-yinyang');
      icon.style.setProperty('--angle', yinyangAngle + 'deg');
    }

    // The new theme spills out of the yin-yang in a growing circle until it
    // covers the page. Browsers without view transitions, and anyone who
    // prefers reduced motion, just get the instant switch.
    function toggleTheme() {
      var next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
      var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      if (!document.startViewTransition || reduceMotion) {
        switchTheme(next);
        return;
      }

      var box = document.getElementById('theme-toggle').getBoundingClientRect();
      var x = box.left + box.width / 2;
      var y = box.top + box.height / 2;
      var radius = Math.hypot(Math.max(x, innerWidth - x), Math.max(y, innerHeight - y));

      document.startViewTransition(function () { switchTheme(next); }).ready.then(function () {
        document.documentElement.animate(
          { clipPath: ['circle(0px at ' + x + 'px ' + y + 'px)', 'circle(' + radius + 'px at ' + x + 'px ' + y + 'px)'] },
          { duration: 500, easing: 'cubic-bezier(0.4, 0, 0.2, 1)', pseudoElement: '::view-transition-new(root)' }
        );
      });
    }

    applyTheme(document.documentElement.getAttribute('data-theme'));

    function copyText(text) {
      if (navigator.clipboard && window.isSecureContext) {
        return navigator.clipboard.writeText(text);
      }
      var field = document.createElement('textarea');
      field.value = text;
      field.style.position = 'fixed';
      field.style.opacity = '0';
      document.body.appendChild(field);
      field.select();
      document.execCommand('copy');
      document.body.removeChild(field);
      return Promise.resolve();
    }

    var toastTimer;

    function copyEmail(event) {
      event.preventDefault();
      var address = 'conanc@princeton.edu';
      var toast = document.getElementById('copy-toast');
      function notify() {
        toast.style.opacity = '1';
        clearTimeout(toastTimer);
        toastTimer = setTimeout(function () { toast.style.opacity = '0'; }, 2000);
      }
      copyText(address).then(notify, notify);
    }

    // Staggers the fade-in: numbers each piece in page order so the CSS can
    // delay it, then starts them all at once.
    if (document.documentElement.classList.contains('anim-hide')) {
      var pieces = document.querySelectorAll('.header, .bio, .block, .rule, .updated, .term');
      for (var i = 0; i < pieces.length; i++) pieces[i].style.setProperty('--i', Math.min(i, 12));
      document.documentElement.classList.add('anim-play');
      document.documentElement.classList.remove('anim-hide');
    }
  </script>
</body>

</html>
