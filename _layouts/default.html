<!DOCTYPE HTML>
<html lang="en">

<head>
  <title>{{ page.title | default: site.name }}</title>

  <script>
    (function () {
      // Hides the page before first paint, so it never
      // flashes fully rendered first. Skipped entirely under reduced motion,
      // so that path never hides anything.
      var reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      if (!reduceMotion) {
        document.documentElement.classList.add('anim-hide');
      }
    })();
  </script>

  <meta content="text/html; charset=utf-8" http-equiv="Content-Type">
  <meta name="google" content="notranslate">

  <meta name="author" content="{{ site.name }}" />
  <!-- Keeps search engines from listing the site; it is only for people who have the link -->
  <meta name="robots" content="noindex, nofollow">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@100..800&display=swap">

  <!-- Build timestamp busts the browser cache whenever the site is rebuilt -->
  <link rel="stylesheet" type="text/css" href="{{ site.baseurl }}/style.css?v={{ site.time | date: '%s' }}" />
  <link rel="canonical" href="{{ page.url | replace:'index.html','' | prepend: site.baseurl | prepend: site.url }}">

  <link rel="icon" type="image/x-icon" href="{{ site.baseurl }}/favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="{{ site.baseurl }}/images/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="{{ site.baseurl }}/images/favicon-16.png">
  <link rel="icon" type="image/png" sizes="192x192" href="{{ site.baseurl }}/images/favicon-192.png">
  <link rel="apple-touch-icon" href="{{ site.baseurl }}/images/apple-touch-icon.png">

  <!-- Loads the site's other pages ahead of a click (all of them as soon as
       the page is up, and fully renders one when the pointer rests on its
       link), so switching to it is near instant -->
  <script type="speculationrules">
  {
    "prefetch": [{ "where": { "href_matches": "/*" }, "eagerness": "eager" }],
    "prerender": [{ "where": { "href_matches": "/*" }, "eagerness": "moderate" }]
  }
  </script>
</head>

<body>
  <div class="page{% if page.quick_entrance %} quick-entrance{% endif %}">
    <header class="header">
      <div class="header-row">
        {% if page.home %}<h1 translate="no" id="site-name" title="Retype">{{ page.heading | default: site.name }}</h1>{% else %}<h1 translate="no"><a class="name-link" href="{{ site.baseurl }}/">{{ page.heading | default: site.name }}</a></h1>{% endif %}
      </div>
      {% if page.subtitle %}<p class="subtitle" translate="no">{{ page.subtitle }}</p>{% endif %}
    </header>

    <script>
      // Scrambles text into new text, churning through random characters that
      // lock in left to right. It takes a list of [element, text] parts and
      // treats them as one line, so a sentence split across several elements
      // scrambles as a whole. A part's text can be a function, read afresh every
      // frame, for text that keeps changing underneath (like a ticking clock).
      // Digits churn through digits and everything else through letters;
      // spaces stay put. Calls done() once every part has settled.
      window.scrambleSwap = function (parts, ms, done) {
        var TICK = 40;  // ms between scramble frames
        var LETTERS = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz';
        var DIGITS = '0123456789';
        var reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        function read(part) {
          return typeof part[1] === 'function' ? part[1]() : part[1];
        }
        function settle() {
          parts.forEach(function (part) { part[0].textContent = read(part); });
          if (done) done();
        }
        if (reduceMotion) { settle(); return; }

        var length = parts.reduce(function (sum, part) { return sum + read(part).length; }, 0);
        var ticks = Math.max(2, Math.round(ms / TICK));
        var lockStart = ticks * 0.25;
        var step = length > 1 ? (ticks - 1 - lockStart) / (length - 1) : 0;
        var n = 0;
        var id = setInterval(function () {
          var at = 0;  // position along the whole line
          parts.forEach(function (part) {
            var text = read(part);
            var out = '';
            for (var i = 0; i < text.length; i++, at++) {
              var c = text.charAt(i);
              var pool = /\d/.test(c) ? DIGITS : LETTERS;
              out += (n >= lockStart + at * step || /\s/.test(c))
                ? c : pool.charAt(Math.floor(Math.random() * pool.length));
            }
            part[0].textContent = out;
          });
          if (++n > ticks) {
            clearInterval(id);
            settle();
          }
        }, TICK);
      };
    </script>

    {{ content }}
  </div>

  <div id="copy-toast">Copied to clipboard</div>

  <script>
    function copyText(text) {
      if (navigator.clipboard && window.isSecureContext) {
        return navigator.clipboard.writeText(text);
      }
      var field = document.createElement('textarea');
      field.value = text;
      field.style.position = 'fixed';
      field.style.opacity = '0';
      document.body.appendChild(field);
      field.select();
      document.execCommand('copy');
      document.body.removeChild(field);
      return Promise.resolve();
    }

    var toastTimer;
    var emailResetTimer;

    // "by email" turns into the address as it's copied, and back again a few
    // seconds later; clicks in between just restart that wait
    function copyEmail(event) {
      event.preventDefault();
      var address = 'conanc@princeton.edu';
      var label = document.getElementById('email-text');
      if (label) label.textContent = 'at ' + address;
      clearTimeout(emailResetTimer);
      emailResetTimer = setTimeout(function () {
        if (label) label.textContent = 'by email';
      }, 5000);

      var toast = document.getElementById('copy-toast');
      function notify() {
        toast.style.opacity = '1';
        clearTimeout(toastTimer);
        toastTimer = setTimeout(function () { toast.style.opacity = '0'; }, 2000);
      }
      copyText(address).then(notify, notify);
    }

    // Staggers the fade-in: numbers each piece in page order so the CSS can
    // delay it, then starts them all at once.
    var root = document.documentElement;
    // The name only types itself out on arriving at the site, not on coming
    // back to the home page from one of its other pages
    var nav = performance.getEntriesByType && performance.getEntriesByType('navigation')[0];
    var fromSite = false;
    try { fromSite = new URL(document.referrer).origin === location.origin; } catch (e) {}
    var returning = fromSite || (nav && nav.type === 'back_forward');
    function playEntrance() {
      var pieces = document.querySelectorAll('.subtitle, .sort-line, .bio, .block, .bs-cabinet, .bs-list, .rule, .updated, .webring, .term');
      for (var i = 0; i < pieces.length; i++) pieces[i].style.setProperty('--i', Math.min(i, 12));
      root.classList.add('anim-play');
      root.classList.remove('anim-hide');
      {% if page.home %}if (!returning) typeName();{% endif %}
    }

    if (root.classList.contains('anim-hide')) {
      // A page loaded ahead of the click waits until it's actually shown,
      // so the switch cuts straight to it and the entrance plays from there
      if (document.prerendering) {
        document.addEventListener('prerenderingchange', playEntrance, { once: true });
      } else {
        playEntrance();
      }

      // Coming back to a page the browser kept in memory plays it again too
      window.addEventListener('pageshow', function (event) {
        if (!event.persisted) return;
        returning = true;
        root.classList.add('anim-hide');
        root.classList.remove('anim-play');
        void root.offsetWidth;  // lets the restart take
        playEntrance();
      });
    }

    // Types an element's text out, a letter at a time behind a caret, which
    // blinks twice once it's done and goes. Each element keeps its own
    // timers, so a replay starts its typing over
    function stopTyping(el) {
      (el._typing || []).forEach(clearInterval);
      el._typing = [];
    }

    // Swaps the element's text for the typed part and a caret, keeping the
    // whole text as its label for screen readers meanwhile
    function setUpTyping(el, shown) {
      var text = el.getAttribute('aria-label') || el.textContent;
      el.setAttribute('aria-label', text);
      el.textContent = '';
      var typed = document.createElement('span');
      typed.setAttribute('aria-hidden', 'true');
      typed.textContent = shown;
      var caret = document.createElement('span');
      caret.className = 'caret';
      caret.setAttribute('aria-hidden', 'true');
      el.appendChild(typed);
      el.appendChild(caret);
      return { text: text, typed: typed, caret: caret };
    }

    function typeOut(el) {
      stopTyping(el);
      var parts = setUpTyping(el, '');
      var n = 0;
      var id = setInterval(function () {
        parts.typed.textContent = parts.text.slice(0, ++n);
        if (n < parts.text.length) return;
        clearInterval(id);
        // off, on, off, on, then gone
        var blinks = 0;
        var blink = setInterval(function () {
          parts.caret.style.visibility = ++blinks % 2 ? 'hidden' : '';
          if (blinks < 5) return;
          clearInterval(blink);
          el.textContent = parts.text;
          el.removeAttribute('aria-label');
        }, 400);
        el._typing.push(blink);
      }, 75);
      el._typing.push(id);
    }

    // Backspaces the text away from where it stands (even mid-type), then
    // after a beat on the empty line types it back out
    function retype(el) {
      if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
      var typedNow = el.querySelector('span');
      var shown = typedNow ? typedNow.textContent : el.textContent;
      stopTyping(el);
      var parts = setUpTyping(el, shown);
      var id = setInterval(function () {
        parts.typed.textContent = parts.typed.textContent.slice(0, -1);
        if (parts.typed.textContent) return;
        clearInterval(id);
        el._typing.push(setTimeout(function () { typeOut(el); }, 300));
      }, 45);
      el._typing.push(id);
    }

    // On the home page the name types itself out on arriving (on the other
    // pages it holds still, as the page changes under it)
    function typeName() {
      typeOut(document.querySelector('.header h1'));
    }

    {% if page.home %}
    // Pressing the name, or a section's title, retypes it
    document.querySelectorAll('#site-name, .block > .block-label').forEach(function (el) {
      el.addEventListener('click', function () { retype(el); });
    });
    {% endif %}
  </script>
</body>

</html>
