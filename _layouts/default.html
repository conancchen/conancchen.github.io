<!DOCTYPE HTML>
<html lang="en">

<head>
  <title>{{ page.title | default: site.name }}</title>

  <script>
    (function () {
      // Hides the page before first paint, so it never
      // flashes fully rendered first. Skipped entirely under reduced motion,
      // so that path never hides anything.
      var reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      if (!reduceMotion) {
        document.documentElement.classList.add('anim-hide');
      }
    })();
  </script>

  <meta content="text/html; charset=utf-8" http-equiv="Content-Type">
  <meta name="google" content="notranslate">

  <meta name="author" content="{{ site.name }}" />
  <!-- Keeps search engines from listing the site; it is only for people who have the link -->
  <meta name="robots" content="noindex, nofollow">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@100..800&display=swap">

  <!-- Build timestamp busts the browser cache whenever the site is rebuilt -->
  <link rel="stylesheet" type="text/css" href="{{ site.baseurl }}/style.css?v={{ site.time | date: '%s' }}" />
  <link rel="canonical" href="{{ page.url | replace:'index.html','' | prepend: site.baseurl | prepend: site.url }}">

  <link rel="icon" type="image/x-icon" href="{{ site.baseurl }}/favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="{{ site.baseurl }}/images/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="{{ site.baseurl }}/images/favicon-16.png">
  <link rel="icon" type="image/png" sizes="192x192" href="{{ site.baseurl }}/images/favicon-192.png">
  <link rel="apple-touch-icon" href="{{ site.baseurl }}/images/apple-touch-icon.png">
</head>

<body>
  <div class="page">
    <header class="header">
      <div class="header-row">
        <h1 translate="no">{{ page.heading | default: site.name }}</h1>
        <div class="header-actions">
        {% unless page.home %}<a class="icon-button" href="{{ site.baseurl }}/" aria-label="Back to the home page" title="Back">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="7 3 3 7 7 11"></polyline>
            <path d="M3 7h11a6 6 0 0 1 0 12H6"></path>
          </svg>
        </a>{% endunless %}
        </div>
      </div>
      {% if page.subtitle %}<p class="subtitle" translate="no">{{ page.subtitle }}</p>{% endif %}
    </header>

    <script>
      // Scrambles text into new text, churning through random characters that
      // lock in left to right. It takes a list of [element, text] parts and
      // treats them as one line, so a sentence split across several elements
      // scrambles as a whole. A part's text can be a function, read afresh every
      // frame, for text that keeps changing underneath (like a ticking clock).
      // Digits churn through digits and everything else through letters;
      // spaces stay put. Calls done() once every part has settled.
      window.scrambleSwap = function (parts, ms, done) {
        var TICK = 40;  // ms between scramble frames
        var LETTERS = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz';
        var DIGITS = '0123456789';
        var reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        function read(part) {
          return typeof part[1] === 'function' ? part[1]() : part[1];
        }
        function settle() {
          parts.forEach(function (part) { part[0].textContent = read(part); });
          if (done) done();
        }
        if (reduceMotion) { settle(); return; }

        var length = parts.reduce(function (sum, part) { return sum + read(part).length; }, 0);
        var ticks = Math.max(2, Math.round(ms / TICK));
        var lockStart = ticks * 0.25;
        var step = length > 1 ? (ticks - 1 - lockStart) / (length - 1) : 0;
        var n = 0;
        var id = setInterval(function () {
          var at = 0;  // position along the whole line
          parts.forEach(function (part) {
            var text = read(part);
            var out = '';
            for (var i = 0; i < text.length; i++, at++) {
              var c = text.charAt(i);
              var pool = /\d/.test(c) ? DIGITS : LETTERS;
              out += (n >= lockStart + at * step || /\s/.test(c))
                ? c : pool.charAt(Math.floor(Math.random() * pool.length));
            }
            part[0].textContent = out;
          });
          if (++n > ticks) {
            clearInterval(id);
            settle();
          }
        }, TICK);
      };
    </script>

    {{ content }}
  </div>

  <div id="copy-toast">Copied to clipboard</div>

  <script>
    function copyText(text) {
      if (navigator.clipboard && window.isSecureContext) {
        return navigator.clipboard.writeText(text);
      }
      var field = document.createElement('textarea');
      field.value = text;
      field.style.position = 'fixed';
      field.style.opacity = '0';
      document.body.appendChild(field);
      field.select();
      document.execCommand('copy');
      document.body.removeChild(field);
      return Promise.resolve();
    }

    var toastTimer;
    var emailResetTimer;

    // "by email" turns into the address as it's copied, and back again a few
    // seconds later; clicks in between just restart that wait
    function copyEmail(event) {
      event.preventDefault();
      var address = 'conanc@princeton.edu';
      var label = document.getElementById('email-text');
      if (label) label.textContent = 'at ' + address;
      clearTimeout(emailResetTimer);
      emailResetTimer = setTimeout(function () {
        if (label) label.textContent = 'by email';
      }, 5000);

      var toast = document.getElementById('copy-toast');
      function notify() {
        toast.style.opacity = '1';
        clearTimeout(toastTimer);
        toastTimer = setTimeout(function () { toast.style.opacity = '0'; }, 2000);
      }
      copyText(address).then(notify, notify);
    }

    // Staggers the fade-in: numbers each piece in page order so the CSS can
    // delay it, then starts them all at once.
    if (document.documentElement.classList.contains('anim-hide')) {
      var pieces = document.querySelectorAll('.subtitle, .header-actions, .sort-line, .bio, .block, .bs-cabinet, .bs-list, .rule, .updated, .webring, .term');
      for (var i = 0; i < pieces.length; i++) pieces[i].style.setProperty('--i', Math.min(i, 12));
      document.documentElement.classList.add('anim-play');
      document.documentElement.classList.remove('anim-hide');
    }
  </script>

  <script>
    // Font picker, only when the site is served locally: a menu in the corner
    // that loads a font from Google Fonts and swaps it in, remembered across
    // pages, for trying fonts against the one style.scss sets (--font)
    (function () {
      if (!/^(localhost|127\.0\.0\.1|0\.0\.0\.0)$/.test(location.hostname)) return;

      var SANS = ", -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif";
      var MONO = ", 'SF Mono', Menlo, Consolas, monospace";
      // Each choice sets the text's font, and optionally a second font for
      // the small data-like bits (years, dates, course codes, the clock);
      // without one, those stay in the text's font
      var INTER = { name: 'Inter', family: 'Inter:wght@100..900', stack: SANS };
      // A mono font's space is as wide as a letter, so its spaces are drawn
      // in a little (spacing, a word-spacing)
      var JETBRAINS = { name: 'JetBrains Mono', family: 'JetBrains+Mono:wght@100..800', stack: MONO, adjust: 0.53, spacing: '-0.15em' };  // 0.5px smaller: its x-height is 0.55, scaled by 13.5/14
      var FIRA = { name: 'Fira Code', family: 'Fira+Code:wght@300..700', stack: MONO, spacing: '-0.15em' };
      var FONTS = [
        { label: 'Inter', text: INTER },
        { label: 'Inter + mono accents', text: INTER, accent: JETBRAINS },
        { label: 'JetBrains Mono', text: JETBRAINS },
        { label: 'Fira Code', text: FIRA }
      ];
      var KEY = 'dev-font';
      var loaded = {};
      var root = document.documentElement;

      function load(font) {
        if (loaded[font.name]) return;
        var link = document.createElement('link');
        link.rel = 'stylesheet';
        link.href = 'https://fonts.googleapis.com/css2?family=' + font.family + '&display=swap';
        document.head.appendChild(link);
        loaded[font.name] = true;
      }

      function setVar(prop, value) {
        if (value) root.style.setProperty(prop, value);
        else root.style.removeProperty(prop);
      }

      // (A font without its own size or spacing says so outright, so the
      // site's own JetBrains Mono settings don't carry over to it)
      function set(prop, font) {
        if (font) load(font);
        setVar(prop, font && "'" + font.name + "'" + font.stack);
        setVar(prop + '-adjust', font && (font.adjust || 'none'));
        setVar(prop + '-spacing', font && (font.spacing || 'normal'));
      }

      function apply(choice) {
        set('--font', choice.text);
        set('--font-accent', choice.accent);
        try { localStorage.setItem(KEY, choice.label); } catch (e) {}
        window.dispatchEvent(new Event('fontchange'));
      }

      var picker = document.createElement('select');
      picker.setAttribute('aria-label', 'Font');
      picker.style.cssText = 'position:fixed;right:12px;bottom:12px;z-index:2147483647;' +
        'font:13px -apple-system,BlinkMacSystemFont,sans-serif;padding:6px 8px;' +
        'border:1px solid #d8d6d0;border-radius:8px;background:#fff;color:#16150f;' +
        'box-shadow:0 2px 8px rgba(0,0,0,0.08)';
      FONTS.forEach(function (font) {
        var option = document.createElement('option');
        option.value = font.label;
        option.textContent = font.label;
        picker.appendChild(option);
      });
      picker.addEventListener('change', function () {
        apply(FONTS.filter(function (f) { return f.label === picker.value; })[0]);
      });
      document.body.appendChild(picker);

      // ?font=JetBrains+Mono in the address picks one straight away (by its label)
      var saved = new URLSearchParams(location.search).get('font');
      if (!saved) try { saved = localStorage.getItem(KEY); } catch (e) {}
      var start = FONTS.filter(function (f) { return f.label === saved; })[0];
      picker.value = 'JetBrains Mono';  // what the site uses
      if (start && start.label !== 'JetBrains Mono') {
        picker.value = start.label;
        apply(start);
      }

      // Arrow keys step through the fonts without opening the menu
      document.addEventListener('keydown', function (e) {
        if (!e.altKey || (e.key !== 'ArrowDown' && e.key !== 'ArrowUp')) return;
        e.preventDefault();
        var i = picker.selectedIndex + (e.key === 'ArrowDown' ? 1 : -1);
        picker.selectedIndex = (i + FONTS.length) % FONTS.length;
        apply(FONTS[picker.selectedIndex]);
      });
    })();
  </script>
</body>

</html>
