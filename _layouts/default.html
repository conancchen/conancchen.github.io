<!DOCTYPE HTML>
<html lang="en">

<head>
  <title>{{ page.title | default: site.name }}</title>

  <!-- Runs before paint so the saved theme applies without a flash -->
  <script>
    (function () {
      document.documentElement.setAttribute('data-theme', localStorage.getItem('theme') || 'dark');

      // Hides the page's typed content and fade-in content before first
      // paint, so neither ever flashes fully rendered first. Skipped
      // entirely under reduced motion, so that path never hides anything.
      var reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      if (!reduceMotion) {
        document.documentElement.classList.add('anim-hide-type', 'anim-hide-fade');
      }
    })();
  </script>

  <meta content="text/html; charset=utf-8" http-equiv="Content-Type">

  <meta name="author" content="{{ site.name }}" />
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap">

  <!-- Build timestamp busts the browser cache whenever the site is rebuilt -->
  <link rel="stylesheet" type="text/css" href="{{ site.baseurl }}/style.css?v={{ site.time | date: '%s' }}" />
  <link rel="canonical" href="{{ page.url | replace:'index.html','' | prepend: site.baseurl | prepend: site.url }}">

  <link rel="icon" type="image/x-icon" href="{{ site.baseurl }}/favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="{{ site.baseurl }}/images/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="{{ site.baseurl }}/images/favicon-16.png">
  <link rel="icon" type="image/png" sizes="192x192" href="{{ site.baseurl }}/images/favicon-192.png">
  <link rel="apple-touch-icon" href="{{ site.baseurl }}/images/apple-touch-icon.png">
</head>

<body>
  <div class="page">
    <header class="header">
      <div class="header-row">
        <h1><a href="{{ site.baseurl }}/" class="home-link">{{ page.heading | default: site.name }}</a></h1>
        <button id="theme-toggle" onclick="toggleTheme()" aria-label="Switch to light mode" title="Switch to light mode">
          <svg class="icon-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="4"></circle>
            <line x1="12" y1="2" x2="12" y2="4"></line>
            <line x1="12" y1="20" x2="12" y2="22"></line>
            <line x1="4.93" y1="4.93" x2="6.34" y2="6.34"></line>
            <line x1="17.66" y1="17.66" x2="19.07" y2="19.07"></line>
            <line x1="2" y1="12" x2="4" y2="12"></line>
            <line x1="20" y1="12" x2="22" y2="12"></line>
            <line x1="4.93" y1="19.07" x2="6.34" y2="17.66"></line>
            <line x1="17.66" y1="6.34" x2="19.07" y2="4.93"></line>
          </svg>
          <svg class="icon-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
          </svg>
        </button>
      </div>
    </header>

    <!-- Runs as soon as the title is parsed, so the first paint is already scrambled -->
    <script>
      // Cycles the title through random, randomly colored glyphs, locking
      // each one in (in the normal text color) from left to right until it
      // spells the real name
      (function () {
        var link = document.querySelector('.home-link');
        var reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        if (!link || reduceMotion) return;

        var finalText = link.textContent;

        // Scramble glyphs come from many scripts and symbol blocks. Each block
        // is picked with equal odds (so small ones like Greek show up as often
        // as CJK), and only blocks that are fully assigned, left-to-right and
        // not emoji are used, so nothing renders as a missing-glyph box, flips
        // text direction, or turns into a color emoji.
        var GLYPH_BLOCKS = [
          [0x00C0, 0x024F],  // Latin-1 / Latin Extended
          [0x0391, 0x03A1],  // Greek capitals
          [0x03A3, 0x03C9],  // Greek capitals + lowercase
          [0x0410, 0x044F],  // Cyrillic
          [0x2190, 0x21FF],  // Arrows
          [0x2200, 0x22FF],  // Math operators
          [0x2500, 0x259F],  // Box drawing + block elements
          [0x25A0, 0x25F7],  // Geometric shapes
          [0x2800, 0x28FF],  // Braille
          [0x3041, 0x3096],  // Hiragana
          [0x30A1, 0x30FA],  // Katakana
          [0xAC00, 0xD7A3],  // Hangul syllables
          [0x4E00, 0x9FA5]   // CJK ideographs
        ];

        function randomGlyph() {
          var block = GLYPH_BLOCKS[Math.floor(Math.random() * GLYPH_BLOCKS.length)];
          return String.fromCharCode(block[0] + Math.floor(Math.random() * (block[1] - block[0] + 1)));
        }

        var TICK = 40;        // ms between scramble frames
        var LOCK_START = 11.25;  // ticks of pure scramble before the first letter locks
        var LOCK_STEP = 3.75;    // ticks between each following letter locking
        // Any hue is fair game, but saturation and lightness are fixed so the
        // colors read as one family (tweak these to change the feel)
        var SATURATION = 75;       // %
        var LIGHTNESS_DARK = 70;   // % on the dark theme
        var LIGHTNESS_LIGHT = 45;  // % on the light theme
        var lastTick = LOCK_START + finalText.length * LOCK_STEP;
        var tick = 0;

        // Screen readers should hear the name, not the gibberish
        link.setAttribute('aria-label', finalText);

        // Fallback fonts for exotic glyphs can have different line metrics and
        // widths; pin the heading's height and keep the name on one line so
        // the page below never jumps while it scrambles
        var heading = link.parentNode;
        heading.style.height = heading.offsetHeight + 'px';
        link.style.whiteSpace = 'nowrap';

        // One span per character so each can carry its own color
        link.textContent = '';
        var glyphs = finalText.split('').map(function (ch) {
          var span = document.createElement('span');
          link.appendChild(span);
          return span;
        });

        function randomColor() {
          var dark = document.documentElement.getAttribute('data-theme') === 'dark';
          var hue = Math.floor(Math.random() * 360);
          return 'hsl(' + hue + ', ' + SATURATION + '%, ' + (dark ? LIGHTNESS_DARK : LIGHTNESS_LIGHT) + '%)';
        }

        function render() {
          for (var i = 0; i < finalText.length; i++) {
            var span = glyphs[i];
            if (tick >= LOCK_START + i * LOCK_STEP || finalText[i] === ' ') {
              span.textContent = finalText[i];
              span.style.color = '';
            } else {
              span.textContent = randomGlyph();
              span.style.color = randomColor();
            }
          }
        }

        render();
        var timer = setInterval(function () {
          tick++;
          render();
          if (tick >= lastTick) {
            clearInterval(timer);
            heading.style.height = '';
            link.style.whiteSpace = '';
          }
        }, TICK);
      })();
    </script>

    {{ content }}
  </div>

  <div id="copy-toast">Copied to clipboard!</div>

  <script>
    function applyTheme(theme) {
      document.documentElement.setAttribute('data-theme', theme);
      var label = theme === 'dark' ? 'Switch to light mode' : 'Switch to dark mode';
      var toggle = document.getElementById('theme-toggle');
      toggle.setAttribute('aria-label', label);
      toggle.setAttribute('title', label);
    }

    function toggleTheme() {
      var next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
      localStorage.setItem('theme', next);
      applyTheme(next);
    }

    applyTheme(document.documentElement.getAttribute('data-theme'));

    function copyText(text) {
      if (navigator.clipboard && window.isSecureContext) {
        return navigator.clipboard.writeText(text);
      }
      var field = document.createElement('textarea');
      field.value = text;
      field.style.position = 'fixed';
      field.style.opacity = '0';
      document.body.appendChild(field);
      field.select();
      document.execCommand('copy');
      document.body.removeChild(field);
      return Promise.resolve();
    }

    var emailResetTimer;
    var toastTimer;

    function copyEmail(event) {
      event.preventDefault();
      // The link is typed out live; overwriting it mid-typing would garble it
      if (document.querySelector('.type-cursor')) return;
      var address = 'conanc@princeton.edu';
      var link = document.getElementById('email-link');
      link.textContent = 'at ' + address;

      // Rapid clicks restart the countdown instead of stacking timers
      clearTimeout(emailResetTimer);
      emailResetTimer = setTimeout(function () {
        link.textContent = 'by email';
      }, 3000);

      var toast = document.getElementById('copy-toast');
      function notify() {
        toast.style.opacity = '1';
        clearTimeout(toastTimer);
        toastTimer = setTimeout(function () { toast.style.opacity = '0'; }, 2000);
      }
      copyText(address).then(notify, notify);
    }

    // Types out the page's ".type-target" content one character at a time,
    // walking each item's real nodes (not raw HTML) so links stay clickable
    // as they're typed. Which children count as "items" is set per page via
    // data-type-items (defaults to "p"). Once typing finishes, ".fade-target"
    // (if present) is revealed — either right away or after the visitor
    // touches a key/mouse/trackpad, per data-fade-trigger ("auto"|"input").
    // Pressing Space while typing skips ahead to the finished text.
    (function () {
      var reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      var container = document.querySelector('.type-target');

      function revealFade() {
        document.documentElement.classList.remove('anim-hide-fade');
      }

      if (reduceMotion || !container) {
        document.documentElement.classList.remove('anim-hide-type');
        revealFade();
        return;
      }

      var itemSelector = container.getAttribute('data-type-items') || 'p';
      var fadeTrigger = container.getAttribute('data-fade-trigger') || 'auto';
      var items = Array.prototype.filter.call(container.children, function (el) {
        return el.matches(itemSelector);
      });

      if (!items.length) {
        document.documentElement.classList.remove('anim-hide-type');
        revealFade();
        return;
      }

      var CHAR_DELAY = 10;
      var ITEM_PAUSE = 86;

      var originals = items.map(function (item) {
        // Drop pure-whitespace text nodes (source indentation/newlines) —
        // typing them either leaves a stray trailing space once the cursor
        // moves past it, or just wastes time on invisible characters
        var nodes = Array.prototype.slice.call(item.childNodes).filter(function (n) {
          return !(n.nodeType === Node.TEXT_NODE && /^\s*$/.test(n.textContent));
        });
        item.innerHTML = '';
        return nodes;
      });

      // The container was hidden pre-paint; now that it's empty, reveal it
      // so typing fills already-visible (but blank) items
      document.documentElement.classList.remove('anim-hide-type');

      var cursor = document.createElement('span');
      cursor.className = 'type-cursor';

      // Only one typing timer is ever pending; tracking it lets Space cancel it
      var typingTimer;
      var typingDone = false;

      function typeText(target, text, i, done) {
        if (i >= text.length) return done();
        target.appendChild(document.createTextNode(text[i]));
        target.appendChild(cursor);
        typingTimer = setTimeout(function () {
          typeText(target, text, i + 1, done);
        }, CHAR_DELAY);
      }

      function typeNodesInto(target, nodes, i, done) {
        if (i >= nodes.length) return done();
        var node = nodes[i];
        var next = function () { typeNodesInto(target, nodes, i + 1, done); };
        if (node.nodeType === Node.TEXT_NODE) {
          typeText(target, node.textContent, 0, next);
        } else {
          var el = document.createElement(node.tagName);
          Array.prototype.forEach.call(node.attributes, function (attr) {
            el.setAttribute(attr.name, attr.value);
          });
          target.appendChild(el);
          typeText(el, node.textContent, 0, next);
        }
      }

      function waitForInputThenReveal() {
        var revealed = false;
        var events = ['keydown', 'mousedown', 'touchstart', 'wheel', 'mousemove'];
        function reveal() {
          if (revealed) return;
          revealed = true;
          revealFade();
          events.forEach(function (evt) {
            window.removeEventListener(evt, reveal);
          });
        }
        events.forEach(function (evt) {
          window.addEventListener(evt, reveal, { passive: true });
        });
      }

      function finishTyping() {
        typingDone = true;
        window.removeEventListener('keydown', skipOnSpace);
        cursor.remove();
        if (fadeTrigger === 'input') {
          waitForInputThenReveal();
        } else {
          revealFade();
        }
      }

      // Space jumps straight to the fully typed page
      function skipOnSpace(event) {
        if (event.key !== ' ' || typingDone) return;
        event.preventDefault();
        clearTimeout(typingTimer);
        items.forEach(function (item, i) {
          item.innerHTML = '';
          originals[i].forEach(function (node) { item.appendChild(node); });
        });
        finishTyping();
      }

      window.addEventListener('keydown', skipOnSpace);

      function typeItem(index) {
        if (index >= items.length) return finishTyping();
        typeNodesInto(items[index], originals[index], 0, function () {
          typingTimer = setTimeout(function () { typeItem(index + 1); }, ITEM_PAUSE);
        });
      }

      typeItem(0);
    })();
  </script>
</body>

</html>
